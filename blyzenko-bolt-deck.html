<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Близенько × Bolt Food — Partnership</title>
<style>
:root{--green:#34D186;--dark:#2F313F;--grey:#6B7080;--light:#EEF6F1;--line:#E3E7EA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,-apple-system,sans-serif;background:#0c0f14;color:var(--dark);
display:flex;flex-direction:column;align-items:center;min-height:100vh}
#stage{position:relative;width:min(96vw,1100px);aspect-ratio:16/9;background:#fff;
border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto}
.slide{position:absolute;inset:0;padding:5.2% 5.5%;display:flex;flex-direction:column}
.kick{color:var(--green);font-weight:700;font-size:1.05vw;letter-spacing:.06em;text-transform:uppercase}
.bar{width:5%;height:.7vh;background:var(--green);border-radius:3px;margin-bottom:1.3vh}
h1{font-size:2.5vw;line-height:1.15}
h2{font-size:2.1vw;margin-bottom:1vh}
.logo{position:absolute;top:4.4%;right:5%;height:5.4%}
.sub{color:var(--grey);font-size:1.25vw}
.tiles{display:flex;gap:1.2%;margin-top:2.4vh}
.tile{flex:1;background:var(--light);border-radius:12px;padding:1.5vw;text-align:center}
.tile .big{font-size:2.5vw;font-weight:800;color:var(--green)}
.tile .big.d{color:var(--dark)}
.tile .lab{font-size:1.0vw;color:var(--grey);margin-top:.5vh}
.tile .sub2{font-size:.82vw;color:var(--grey)}
.dark{background:var(--dark);color:#fff;padding:7% 6%}
.dark h1{color:#fff;font-size:3.2vw}
.dark .accent{color:var(--green);font-weight:700}
.note{color:var(--grey);font-size:1.05vw;margin-top:auto}
.foot{position:absolute;bottom:3.2%;left:5.5%;color:var(--grey);font-size:.82vw}
.agenda{display:flex;align-items:center;gap:1.2vw;margin-top:1.6vh}
.num{width:2.6vw;height:2.6vw;border-radius:10px;background:var(--light);color:var(--green);
font-weight:800;font-size:1.3vw;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agenda .t{font-size:1.4vw;font-weight:700}
.agenda .d{font-size:1vw;color:var(--grey)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1.4%;margin-top:2.2vh}
.card{background:var(--light);border-radius:12px;padding:1.4vw 1.6vw;border-left:5px solid var(--green)}
.card h3{font-size:1.4vw}.card p{font-size:1vw;color:var(--grey);margin-top:.5vh}
.scen{display:flex;gap:1.4%;margin-top:2.4vh}
.scol{flex:1;border-radius:14px;background:var(--light);padding:2vw 1vw;text-align:center}
.scol.hot{background:var(--green);color:#fff}
.scol .nm{font-weight:700;font-size:1.3vw}.scol .sh{font-size:.95vw;color:var(--grey)}
.scol.hot .sh{color:#eafff4}
.scol .gmv{font-size:2.3vw;font-weight:800;color:var(--green);margin:.6vh 0}
.scol.hot .gmv{color:#fff}.scol .ord{font-size:1.1vw;font-weight:700}
.two{display:flex;gap:2%;margin-top:1vh}.col{flex:1}
.row{display:flex;justify-content:space-between;background:var(--light);border-radius:10px;
padding:.8vw 1.1vw;margin-top:.8vh;font-size:1.15vw}.row b{color:var(--green)}
.step{display:flex;align-items:center;gap:.9vw;margin-top:.85vh;font-size:1.1vw}
.sc{width:1.9vw;height:1.9vw;border-radius:8px;background:var(--green);color:#fff;font-weight:700;
display:flex;align-items:center;justify-content:center;font-size:.95vw;flex-shrink:0}
.promo{display:flex;gap:1.1%;margin-top:1.8vh}
.pt{flex:1;background:var(--light);border-radius:12px;padding:1vw}
.pt .pn{width:1.9vw;height:1.9vw;border-radius:8px;background:var(--green);color:#fff;font-weight:800;
display:flex;align-items:center;justify-content:center;font-size:1vw;margin-bottom:.7vh}
.pt h4{font-size:1.05vw}.pt p{font-size:.78vw;color:var(--grey);margin-top:.4vh}
.pbot{display:flex;gap:1.4%;margin-top:1.4vh}
.pbox{flex:1;background:var(--light);border-radius:12px;padding:1vw 1.2vw;border-left:5px solid var(--green)}
.pbox.d{border-left-color:var(--dark)}
.pbox h4{font-size:1.1vw}.pbox p{font-size:.85vw;color:var(--grey);margin-top:.4vh}
.eco{display:flex;gap:2%;margin-top:2.4vh}
.ecard{flex:1;background:var(--light);border-radius:14px;overflow:hidden;text-align:center}
.ecard .hd{background:var(--green);color:#fff;font-weight:700;font-size:1.3vw;padding:.8vh 0}
.ecard .bd{padding:1.6vh 0;font-size:1.7vw;font-weight:800;color:var(--dark);line-height:1.35}
.mkgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vh 1.4%;margin-top:2.2vh}
.mk{background:var(--light);border-radius:10px;padding:1vh 1vw;display:flex;align-items:center;gap:.8vw;font-weight:700;font-size:1.15vw}
.mk .d{width:1.5vw;height:1.5vw;border-radius:7px;background:var(--green);flex-shrink:0}
.caltbl{width:100%;border-collapse:collapse;margin-top:1.8vh;font-size:1vw}
.caltbl th{background:var(--dark);color:#fff;padding:.8vh .8vw;text-align:left;font-size:.95vw}
.caltbl td{padding:.7vh .8vw;border-bottom:1px solid var(--line);color:var(--grey)}
.caltbl td:first-child{font-weight:700;color:var(--dark)}
.caltbl tr:nth-child(even) td{background:var(--light)}
.chip{background:var(--light);border-radius:10px;padding:.7vh 1vw;font-size:1vw;color:var(--dark)}
.chip b{color:var(--green)}
.bigmsg{background:var(--green);color:#fff;border-radius:12px;padding:1.2vh 1.4vw;margin-top:1.6vh;font-size:1.1vw;text-align:center}
.bigmsg b{color:#fff}
#nav{display:flex;gap:14px;align-items:center;padding:14px;color:#aab}
#nav button{background:#1b2330;color:#fff;border:1px solid #2c3647;border-radius:8px;
padding:7px 14px;cursor:pointer;font-size:14px}
#nav button:hover{background:#26303f}
#dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#3a4456;cursor:pointer}
.dot.on{background:var(--green)}
.dl{color:var(--green);text-decoration:none}
</style></head>
<body>
<div id="stage"></div>
<div id="nav">
  <button onclick="go(-1)">‹ Назад</button>
  <span id="counter">1 / 15</span>
  <button onclick="go(1)">Далі ›</button>
  <div id="dots"></div>
</div>

<script>
const LOGO='bolt-food-logo.png';
function logo(){return `<img class="logo" src="${LOGO}" onerror="this.style.display='none'">`}
const slides=[
// 1 title
`<div class="slide dark" style="justify-content:center">
  <div class="kick">Partnership proposal</div>
  <h1 style="margin:1.4vh 0">Близенько <span class="accent">×</span> Bolt&nbsp;Food</h1>
  <div class="sub" style="color:#c9ced6">Другий канал, що додає оборот — без канібалізації</div>
  <div style="margin-top:3vh;color:#9aa0ac;font-size:1.1vw">Перша зустріч · Україна · Червень 2026</div>
</div>`,
// 2 agenda
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Agenda</div><h2>Про що говоримо сьогодні</h2>
  ${[['01','Bolt Food та екосистема','масштаб і динаміка росту'],['02','Де Близенько зараз','100% попиту на Glovo, через пікерів'],['03','Пікери vs Дірект-інтеграція','контроль, маржа, capex на нас'],['04','Комісія: сценарії','наш ренж 10–15% + Bolt+'],['05','Інвестиції та маркетинг','3–4% GMV у безкоштовну доставку'],['06','Наступні кроки','як швидко стартуємо']].map(r=>`<div class="agenda"><div class="num">${r[0]}</div><div><div class="t">${r[1]}</div><div class="d">${r[2]}</div></div></div>`).join('')}
</div>`,
// 3 bolt numbers
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Bolt today</div><h2>Bolt — у цифрах</h2>
  <div class="tiles">
   ${[['50+','країн'],['850+','міст'],['4 млн+','замовлень/день'],['€12 млрд+','GMV run-rate'],['30%+','GMV CAGR 21–25']].map(t=>`<div class="tile"><div class="big">${t[0]}</div><div class="lab">${t[1]}</div></div>`).join('')}
  </div>
  <p class="note">Один застосунок: доставка їжі та товарів, таксі, оренда — мільйони активних клієнтів в Україні.</p>
</div>`,
// 4 ecosystem
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Meet Bolt</div><h2>Вся on-demand екосистема в одному застосунку</h2>
  <div class="eco">
   ${[['Таксі','40+ країн','500+ міст'],['Доставка','15+ країн','200+ міст'],['Оренда / самокати','20+ країн','200+ міст']].map(e=>`<div class="ecard"><div class="hd">${e[0]}</div><div class="bd">${e[1]}<br>${e[2]}</div></div>`).join('')}
  </div>
  <p class="note">Крос-вертикальний ефект: користувачів таксі та Food ми конвертуємо у покупців Близенько — нові цифрові клієнти поза вашою офлайн-базою.</p>
</div>`,
// 5 where now — incrementality
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Де ви зараз</div><h2>Близенько на ринку доставки</h2>
  <div class="tiles">
   <div class="tile"><div class="big d">100%</div><div class="lab">онлайн-попиту — на Glovo</div></div>
   <div class="tile"><div class="big d">10–12%</div><div class="lab">комісія, ексклюзив</div></div>
   <div class="tile"><div class="big d">Пікери</div><div class="lab">модель збору замовлень</div></div>
   <div class="tile"><div class="big">0</div><div class="lab">замовлень на Bolt Food</div></div>
  </div>
  <p class="note"><b style="color:var(--dark)">Висновок:</b> сильний стабільний попит на доставку продуктів — але <b style="color:var(--green)">повністю в одному каналі</b>. Bolt = чистий новий канал без канібалізації + диверсифікація залежності від однієї платформи.</p>
  <div class="foot">Ілюстративно. Підставимо ваші реальні обсяги (замовлень/міс, міста, середній чек) у фінальну версію.</div>
</div>`,
// 6 why now
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Можливість</div><h2>Чому зараз</h2>
  <div class="cards">
   ${[['Інкрементальний канал','Близенько = 0 на Bolt Food. Кожне замовлення — поверх Glovo, без канібалізації.'],['Bolt Food росте','3P-магазини +168%, замовлення ×2 за Jan→Apr 2026. Заходите на хвилі росту.'],['Профіль під q-commerce','Продукти біля дому — висока частота й повторні покупки. Ідеально під Bolt+ і безкоштовну доставку.'],['Швидкий старт','Можемо стартувати на пікерах одразу, паралельно готуючи дірект-інтеграцію.']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}
  </div>
</div>`,
// 7 pickers vs direct
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Інтеграція</div><h2>Пікери vs Дірект-інтеграція</h2>
  <table class="caltbl">
   <tr><th>Параметр</th><th>Пікери (модель Glovo)</th><th>Дірект-інтеграція (Bolt)</th></tr>
   ${[['Ціни','націнка пікера → гірша конверсія','ваші реальні ціни, повний контроль'],['Стоки','помилки, out-of-stock, ручне','синхронізація в реальному часі'],['Маржа','«зашита» вартість ручного процесу','нижча собівартість процесу'],['Контроль','мінімальний','асортимент, ціни, промо — у вас'],['Capex','—','Bolt інвестує в інтеграцію']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td style="color:var(--dark);font-weight:700">${r[2]}</td></tr>`).join('')}
  </table>
  <p class="note"><b style="color:var(--dark)">Месидж:</b> на пікерах ви платите за ручний процес і втрачаєте контроль над цінами та стоком. Дірект прибирає це — і саме тому можемо запропонувати <b style="color:var(--green)">нижчу ефективну комісію</b>.</p>
</div>`,
// 8 commission scenarios
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Комісія · ренж 10–15%</div><h2>Чотири сценарії — на вибір</h2>
  <table class="caltbl">
   <tr><th>Сценарій</th><th>Ставка</th><th>Умова</th><th>Логіка</th></tr>
   ${[['1. Match + цінність','12%','= верх Glovo, повний пакет','та сама комісія, але +оборот, +Bolt+, +маркетинг'],['2. Дірект → дешевше','10–11%','за умови дірект-інтеграції','прибираємо націнку пікера, capex на нас'],['3. Volume tiers','13–14% → 10–11%','падає після порогу GMV','стимул рости, захист маржі на старті'],['4. Hybrid старт','14–15% → дірект','швидкий вхід на пікерах, далі міграція','низький бар’єр входу, як у Glovo'],['+ Bolt+','+2 п.п.','лише на замовлення підписників','середньозважена ≈ база +0,3–0,4 п.п.']].map(r=>`<tr><td>${r[0]}</td><td style="color:var(--green);font-weight:800">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
  </table>
  <div class="foot">Рекомендовано: сценарій 2 (дірект) як ціль, сценарій 4 — для швидкого старту з подальшим зниженням.</div>
</div>`,
// 9 bolt plus
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Bolt Plus</div><h2>Преміум-аудиторія, що замовляє частіше</h2>
  <div class="tiles">
   <div class="tile"><div class="big">2.1–2.2×</div><div class="lab">частіше замовляють підписники Bolt+</div></div>
   <div class="tile"><div class="big">+12–17%</div><div class="lab">замовлень/міс після оформлення підписки</div></div>
   <div class="tile"><div class="big d">3 сервіси</div><div class="lab">таксі · Bolt Food · самокати в одній підписці</div></div>
  </div>
  <div style="margin-top:1.8vh">
   ${[['Доступ до преміум-клієнтів —','найактивніші користувачі з високим середнім чеком.'],['Більше видимості —','окрема категорія на головному екрані, банер і бейдж Bolt Plus.'],['Комісія Bolt Plus —','+2 п.п. лише на замовлення підписників; для решти — базова ставка.']].map(b=>`<div class="row" style="justify-content:flex-start;gap:.4vw"><b>${b[0]}</b> <span>${b[1]}</span></div>`).join('')}
  </div>
  <div class="foot">Особливо сильно для продуктового біля дому: щоденні/щотижневі покупки = висока частота.</div>
</div>`,
// 10 bolt plus math
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Чому нижча комісія окупається</div><h2>Кожна 1 ₴ комісії → ~7–8 ₴ обороту</h2>
  <p class="sub" style="margin-top:.6vh">Принцип (ілюстративно, GMV приклад): з Bolt+ оборот вищий, бо частота й видимість зростають. Дивимось на <b>чисте</b> = GMV − комісія.</p>
  <table class="caltbl">
   <tr><th>Показник</th><th>Без Bolt+</th><th>З Bolt+</th><th>Різниця</th></tr>
   <tr><td>GMV / 6 міс</td><td>10,0 млн ₴</td><td>11,5 млн ₴</td><td style="color:var(--dark);font-weight:700">+1,5 млн ₴</td></tr>
   <tr><td>Комісія (≈11%)</td><td>1 100 000 ₴</td><td>1 265 000 ₴</td><td>+165 000 ₴</td></tr>
   <tr><td>Чисте (GMV − комісія)</td><td>8 900 000 ₴</td><td>10 235 000 ₴</td><td style="color:var(--green);font-weight:800">+1 335 000 ₴</td></tr>
  </table>
  <div class="bigmsg">Доплата комісії за Bolt+ ~165 тис ₴ приносить <b>+1,3 млн ₴</b> чистими → програма варта того.</div>
  <div class="foot">Цифри ілюстративні — підставимо ваш реальний GMV і частку Bolt+.</div>
</div>`,
// 11 campaigns 3-4% GMV
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Інвестиції Bolt · skin in the game</div><h2>3–4% GMV — у безкоштовну доставку та промо</h2>
  <div style="display:flex;gap:1.2%;margin-top:1.4vh;flex-wrap:wrap">
   <div class="chip">Bolt співінвестує <b>3–4% від GMV</b></div>
   <div class="chip">Безкоштовна доставка — інструмент <b>№1</b> для нових клієнтів</div>
   <div class="chip">Спільні кампанії на старті</div>
  </div>
  <div class="cards" style="margin-top:1.8vh">
   ${[['Безкоштовна / знижена доставка','Частково або 0 ₴ для нових клієнтів — головний драйвер першого замовлення.'],['Когорти','Таргет на Нових / Втрачених / Активних — різний розмір знижки.'],['Банерна підтримка','Банер у вкладці «Магазини» в періоди активних акцій.'],['Знижки через API','Передаєте фінальні ціни — без +20% ПДВ на знижку.']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}
  </div>
  <div class="foot">Рамка: Bolt не лише бере комісію — вкладає назад у ваш оборот.</div>
</div>`,
// 12 marketing & campaigns reach
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Маркетинг</div><h2>Маркетингові кампанії: до 10× охоплення</h2>
  <div class="scen">
   ${[['Standard','1× охоплення','Email + push Bolt Food',false],['Small','2× охоплення','+ In-app банер, email/push Food & Rides',false],['Big','10× охоплення','+ Спец-категорія, pop-up, соцмережі, paid ads, інфлюенсери',true]].map(s=>`<div class="scol${s[3]?' hot':''}"><div class="nm">${s[0]}</div><div class="gmv">${s[1]}</div><div class="sh">${s[2]}</div></div>`).join('')}
  </div>
  <div class="mkgrid" style="margin-top:2vh">
   ${['Bolt Plus','In-app engagement','Merchant Offers','Online Ads','PR / Social Media','Email + Push'].map(m=>`<div class="mk"><div class="d"></div>${m}</div>`).join('')}
  </div>
  <p class="note">Комбінація каналів Bolt Food + Bolt Rides дає охоплення, недоступне поодинці.</p>
</div>`,
// 13 ask & objections
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Домовленість</div><h2>Що просимо взамін · та відповіді на заперечення</h2>
  <div class="two">
   <div class="col"><div style="font-weight:700;font-size:1.3vw;margin-bottom:.5vh">Взамін за нижчу комісію</div>
    ${['Зняття / пом’якшення ексклюзиву (хоча б non-exclusive пілот)','Зобов’язання на дірект-інтеграцію','Мультимісто rollout, не одне місто','Co-marketing на старті'].map((s,i)=>`<div class="step"><div class="sc">${i+1}</div><span>${s}</span></div>`).join('')}
   </div>
   <div class="col"><div style="font-weight:700;font-size:1.3vw;margin-bottom:.5vh">Заперечення → відповідь</div>
    ${[['«У нас ексклюзив»','не вимагаємо рвати — інкрементальний пілот поза ексклюзивом'],['«Не хочемо ще інтеграцію»','capex на нас + швидкий старт на пікерах'],['«Glovo дає 10%»','ефективна вартість пікерів вища; на дірект ми конкурентні']].map(r=>`<div class="row" style="flex-direction:column;align-items:flex-start;gap:.2vh"><b style="color:var(--dark)">${r[0]}</b><span style="color:var(--grey);font-size:.95vw">${r[1]}</span></div>`).join('')}
   </div>
  </div>
</div>`,
// 14 rollout / next steps
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Запуск</div><h2>З чого починаємо</h2>
  <div class="two">
   <div class="col"><div style="font-weight:700;font-size:1.3vw;margin-bottom:.5vh">Логіка старту</div>
    ${[['Швидкий вхід','на пікерах, як на Glovo'],['Топ-міста','Львів + західний регіон'],['Дірект-інтеграція','паралельно, capex Bolt'],['Зниження комісії','після переходу на дірект']].map(c=>`<div class="row"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}
   </div>
   <div class="col"><div style="font-weight:700;font-size:1.3vw;margin-bottom:.5vh">Наступні кроки</div>
    ${['Підтвердити інтерес і scope пілоту','Узгодити комісійний сценарій','Інтеграція каталогу та цін','Запуск + спільний маркетинг','Огляд результатів через 4 тижні'].map((s,i)=>`<div class="step"><div class="sc">${i+1}</div><span>${s}</span></div>`).join('')}
   </div>
  </div>
</div>`,
// 15 closing
`<div class="slide dark" style="justify-content:center">
  <h1>Готові запустити Близенько на Bolt Food</h1>
  <div class="accent" style="font-size:1.6vw;margin-top:1.6vh">Другий канал · інкрементальний оборот · нижча ефективна комісія на дірект</div>
  <div style="margin-top:3vh;color:#9aa0ac;font-size:1.2vw">Дякуємо! Обговоримо деталі пілоту.</div>
</div>`
];
let i=0;const stage=document.getElementById('stage'),dots=document.getElementById('dots');
stage.innerHTML=slides.map((h,n)=>`<div class="slidewrap${n===0?' on':''}" data-i="${n}" style="position:absolute;inset:0;display:${n===0?'block':'none'}">${h}</div>`).join('');
slides.forEach((_,n)=>{const d=document.createElement('div');d.className='dot'+(n===0?' on':'');d.onclick=()=>set(n);dots.appendChild(d)});
function set(n){i=Math.max(0,Math.min(slides.length-1,n));
  document.querySelectorAll('.slidewrap').forEach(w=>w.style.display=(+w.dataset.i===i)?'block':'none');
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('on',k===i));
  document.getElementById('counter').textContent=(i+1)+' / '+slides.length;}
function go(d){set(i+d)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
</script>
</body></html>
