<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Zoo × Bolt Food — Partnership</title>
<style>
:root{--green:#34D186;--dark:#2F313F;--grey:#6B7080;--light:#EEF6F1;--line:#E3E7EA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,-apple-system,sans-serif;background:#0c0f14;color:var(--dark);
display:flex;flex-direction:column;align-items:center;min-height:100vh}
#stage{position:relative;width:min(96vw,1100px);aspect-ratio:16/9;background:#fff;
border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto}
.slide{position:absolute;inset:0;padding:5.2% 5.5%;display:flex;flex-direction:column}
.kick{color:var(--green);font-weight:700;font-size:1.05vw;letter-spacing:.06em;text-transform:uppercase}
.bar{width:5%;height:.7vh;background:var(--green);border-radius:3px;margin-bottom:1.3vh}
h1{font-size:2.5vw;line-height:1.15}
h2{font-size:2.1vw;margin-bottom:1vh}
.logo{position:absolute;top:4.4%;right:5%;height:5.4%}
.sub{color:var(--grey);font-size:1.25vw}
.tiles{display:flex;gap:1.2%;margin-top:2.4vh}
.tile{flex:1;background:var(--light);border-radius:12px;padding:1.5vw;text-align:center}
.tile .big{font-size:2.5vw;font-weight:800;color:var(--green)}
.tile .big.d{color:var(--dark)}
.tile .lab{font-size:1.0vw;color:var(--grey);margin-top:.5vh}
.tile .sub2{font-size:.82vw;color:var(--grey)}
.dark{background:var(--dark);color:#fff;padding:7% 6%}
.dark h1{color:#fff;font-size:3.2vw}
.dark .accent{color:var(--green);font-weight:700}
.note{color:var(--grey);font-size:1.05vw;margin-top:auto}
.foot{position:absolute;bottom:3.2%;left:5.5%;color:var(--grey);font-size:.82vw}
.agenda{display:flex;align-items:center;gap:1.2vw;margin-top:1.6vh}
.num{width:2.6vw;height:2.6vw;border-radius:10px;background:var(--light);color:var(--green);
font-weight:800;font-size:1.3vw;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agenda .t{font-size:1.4vw;font-weight:700}
.agenda .d{font-size:1vw;color:var(--grey)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1.4%;margin-top:2.2vh}
.card{background:var(--light);border-radius:12px;padding:1.4vw 1.6vw;border-left:5px solid var(--green)}
.card h3{font-size:1.4vw}.card p{font-size:1vw;color:var(--grey);margin-top:.5vh}
.chart{width:100%;margin-top:1.4vh;border-radius:8px}
.scen{display:flex;gap:1.4%;margin-top:2.4vh}
.scol{flex:1;border-radius:14px;background:var(--light);padding:2vw 1vw;text-align:center}
.scol.hot{background:var(--green);color:#fff}
.scol .nm{font-weight:700;font-size:1.3vw}.scol .sh{font-size:.95vw;color:var(--grey)}
.scol.hot .sh{color:#eafff4}
.scol .gmv{font-size:2.3vw;font-weight:800;color:var(--green);margin:.6vh 0}
.scol.hot .gmv{color:#fff}.scol .ord{font-size:1.1vw;font-weight:700}
.two{display:flex;gap:2%;margin-top:1vh}.col{flex:1}
.row{display:flex;justify-content:space-between;background:var(--light);border-radius:10px;
padding:.8vw 1.1vw;margin-top:.8vh;font-size:1.15vw}.row b{color:var(--green)}
.step{display:flex;align-items:center;gap:.9vw;margin-top:.85vh;font-size:1.1vw}
.sc{width:1.9vw;height:1.9vw;border-radius:8px;background:var(--green);color:#fff;font-weight:700;
display:flex;align-items:center;justify-content:center;font-size:.95vw;flex-shrink:0}
.promo{display:flex;gap:1.1%;margin-top:1.8vh}
.pt{flex:1;background:var(--light);border-radius:12px;padding:1vw}
.pt .pn{width:1.9vw;height:1.9vw;border-radius:8px;background:var(--green);color:#fff;font-weight:800;
display:flex;align-items:center;justify-content:center;font-size:1vw;margin-bottom:.7vh}
.pt h4{font-size:1.05vw}.pt p{font-size:.78vw;color:var(--grey);margin-top:.4vh}
.pbot{display:flex;gap:1.4%;margin-top:1.4vh}
.pbox{flex:1;background:var(--light);border-radius:12px;padding:1vw 1.2vw;border-left:5px solid var(--green)}
.pbox.d{border-left-color:var(--dark)}
.pbox h4{font-size:1.1vw}.pbox p{font-size:.85vw;color:var(--grey);margin-top:.4vh}
.eco{display:flex;gap:2%;margin-top:2.4vh}
.ecard{flex:1;background:var(--light);border-radius:14px;overflow:hidden;text-align:center}
.ecard .hd{background:var(--green);color:#fff;font-weight:700;font-size:1.3vw;padding:.8vh 0}
.ecard .bd{padding:1.6vh 0;font-size:1.7vw;font-weight:800;color:var(--dark);line-height:1.35}
.mkgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vh 1.4%;margin-top:2.2vh}
.mk{background:var(--light);border-radius:10px;padding:1vh 1vw;display:flex;align-items:center;gap:.8vw;font-weight:700;font-size:1.15vw}
.mk .d{width:1.5vw;height:1.5vw;border-radius:7px;background:var(--green);flex-shrink:0}
.caltbl{width:100%;border-collapse:collapse;margin-top:1.8vh;font-size:1vw}
.caltbl th{background:var(--dark);color:#fff;padding:.8vh .8vw;text-align:left;font-size:.95vw}
.caltbl td{padding:.7vh .8vw;border-bottom:1px solid var(--line);color:var(--grey)}
.caltbl td:first-child{font-weight:700;color:var(--dark)}
.caltbl tr:nth-child(even) td{background:var(--light)}
.imgwrap{display:flex;justify-content:center;margin-top:1vh}
.imgwrap img{max-height:60vh;max-width:100%;border-radius:8px}
#nav{display:flex;gap:14px;align-items:center;padding:14px;color:#aab}
#nav button{background:#1b2330;color:#fff;border:1px solid #2c3647;border-radius:8px;
padding:7px 14px;cursor:pointer;font-size:14px}
#nav button:hover{background:#26303f}
#dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#3a4456;cursor:pointer}
.dot.on{background:var(--green)}
.dl{color:var(--green);text-decoration:none}
</style></head>
<body>
<div id="stage"></div>
<div id="nav">
  <button onclick="go(-1)">‹ Назад</button>
  <span id="counter">1 / 22</span>
  <button onclick="go(1)">Далі ›</button>
  <div id="dots"></div>
  <a class="dl" href="Master-Zoo-Bolt-Food-Partnership.pptx" download>⬇ .pptx</a>
</div>

<script>
const LOGO='bolt-food-logo.png';
function logo(){return `<img class="logo" src="${LOGO}" onerror="this.style.display='none'">`}
const slides=[
// 1 title
`<div class="slide dark" style="justify-content:center">
  <div class="kick">Partnership proposal</div>
  <h1 style="margin:1.4vh 0">Master&nbsp;Zoo <span class="accent">×</span> Bolt&nbsp;Food</h1>
  <div class="sub" style="color:#c9ced6">Де ми зараз і куди ростемо разом</div>
  <div style="margin-top:3vh;color:#9aa0ac;font-size:1.1vw">Перша зустріч · Україна · Червень 2026</div>
</div>`,
// 2 agenda
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Agenda</div><h2>Про що говоримо сьогодні</h2>

</div>`,
// 3 bolt numbers
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Bolt today</div><h2>Bolt — у цифрах</h2>

   ${[['50+','країн'],['850+','міст'],['4 млн+','замовлень/день'],['€12 млрд+','GMV run-rate'],['30%+','GMV CAGR 21–25']].map(t=>`<div class="tile"><div class="big">${t[0]}</div><div class="lab">${t[1]}</div></div>`).join('')}

// 3b meet bolt ecosystem (MWB s5)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Meet Bolt</div><h2>Вся on-demand екосистема в одному застосунку</h2>

// 4 where now
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Де ви зараз</div><h2>Master Zoo на ринку доставки</h2>
  <div class="tiles">
   <div class="tile"><div class="big d">5&nbsp;513</div><div class="lab">замовлень/міс на Glovo</div></div>
   <div class="tile"><div class="big d">29</div><div class="lab">міст присутності</div></div>
   <div class="tile"><div class="big d">#16</div><div class="lab">ритейл-бренд на Glovo</div></div>
   <div class="tile"><div class="big">0</div><div class="lab">замовлень на Bolt Food</div></div>
  </div>

  <div class="foot">Джерело: Bolt internal data (Databricks) + Get Placed market scan, Jan–Apr 2026</div>
</div>`,
// 5 opportunity
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Можливість</div><h2>Чому зараз</h2>
  <div class="cards">
   ${[['Незайнятий канал','Master Zoo = 0 на Bolt Food. Кожне замовлення інкрементальне, поверх Glovo.'],['Bolt Food росте','Замовлення на платформі ростуть двозначними темпами кв/кв в Україні.'],['Pets — недопредставлені','Зоотовари майже відсутні у food-delivery. Низька конкуренція, висока лояльність.'],['Швидкий старт','Інтеграція каталогу й запуск у топ-містах за кілька тижнів.']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}
  </div>
</div>`,
// 5b growth (market data, no Glovo)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Чому зараз · Bolt Food росте</div><h2>Замовлення ростуть двозначними темпами кв/кв</h2>
  <img class="chart" src="mz-growth.png">
  <p class="note">3P-магазини <b style="color:var(--green)">2 401 → 6 429 (+168%)</b> · замовлення <b style="color:var(--dark)">78k → 154k (×2)</b> за Jan→Apr 2026</p>
  <div class="foot">Базуючись на ринкових даних (Get Placed market scan), Jan–Apr 2026.</div>
</div>`,
// 5c incremental growth (MWB s8+s9)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Чому Bolt</div><h2>Новий канал росту — без ризику</h2>
  <div class="cards">
   ${[['40% — нові клієнти','У середньому 40% замовлень магазину — від клієнтів, які вперше замовляють саме у вас. Чистий інкрементальний попит.'],['Крос-вертикальний попит','Аудиторію таксі та Bolt Food конвертуємо у покупців ваших товарів — нові цифрові клієнти поза офлайн-базою.'],['Модель на комісії','Без цінових війн, демпінгу й витрат на експансію. Маркетинг-подібна інвестиція з високим ROI.'],['Орієнтир економіки','≈16 замовлень/магазин/день, частота ~2× на місяць — і зростає з підпискою та промо.']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}
  </div>
  <div class="foot">Джерело: Bolt market materials (MWB Sales Pitch).</div>
</div>`,
// 5d bolt plus
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Bolt Plus</div><h2>Преміум-аудиторія, що замовляє частіше</h2>
  <div class="tiles">
   <div class="tile"><div class="big">2.1–2.2×</div><div class="lab">частіше замовляють підписники Bolt+</div></div>
   <div class="tile"><div class="big">+12–17%</div><div class="lab">замовлень/міс після оформлення підписки</div></div>
   <div class="tile"><div class="big d">3 сервіси</div><div class="lab">таксі · Bolt Food · самокати в одній підписці</div></div>
  </div>
  <div style="margin-top:1.8vh">
   ${[['Доступ до преміум-клієнтів —','найактивніші користувачі з високим середнім чеком.'],['Більше видимості —','окрема категорія на головному екрані, банер і бейдж Bolt Plus.'],['Комісія Bolt Plus —','лише на замовлення підписників; для решти — стандартна комісія.']].map(b=>`<div class="row" style="justify-content:flex-start;gap:.4vw"><b>${b[0]}</b> <span>${b[1]}</span></div>`).join('')}
  </div>
  <div class="foot">Джерело: презентація «Підписка Bolt+» (UA) + внутрішнє моделювання Bolt. dbx: частка замовлень Bolt+ зростає.</div>
</div>`,
// 5d2a weighted commission — 2 scenarios
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Орієнтовні умови · Bolt+</div><h2>Середньозважена комісія — 2 сценарії</h2>
  <div style="display:flex;gap:1.2%;margin-top:1.4vh">
   <div class="chip">GMV 6 міс (з Bolt+): <b>11,5 млн ₴</b></div>
   <div class="chip">Частка Bolt+: <b>15%</b></div>
   <div class="chip">+2% лише на замовлення Bolt+</div>
  </div>
  <p class="note" style="margin-top:1.2vh"><b>Формула:</b> середньозважена = база + (15% × 2%) = <b>база + 0,3 п.п.</b></p>
  <table class="caltbl" style="text-align:left">
   <tr><th>Сценарій</th><th>GMV 6 міс</th><th>База</th><th>Bolt+ (15%×2%)</th><th>Середньозважена</th><th>Комісія, ₴</th></tr>
   <tr><td>Сценарій 1 — рекоменд.</td><td>11,5 млн</td><td>10%</td><td>+0,3 п.п.</td><td style="color:var(--green);font-weight:800">10,3%</td><td>≈ 1 184 500</td></tr>
   <tr><td>Сценарій 2 — без знижок</td><td>11,5 млн</td><td>12%</td><td>+0,3 п.п.</td><td style="color:var(--green);font-weight:800">12,3%</td><td>≈ 1 414 500</td></tr>
  </table>
  <div class="foot">Якщо частка Bolt+ = 20% → +0,4 п.п.: сценарій 1 = 10,4%, сценарій 2 = 12,4%. +2% лише на замовлення підписників.</div>
</div>`,
// 5d2b worth it — with vs without Bolt+
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Орієнтовні умови · Bolt+</div><h2>Чи варте того? З Bolt+ проти без Bolt+</h2>
  <p class="sub" style="margin-top:.6vh">11,5 млн ₴ — оборот <b>із Bolt+</b>. Без програми оборот <b>−10%</b> = 10,35 млн ₴ (усе за базовою ставкою). Дивимось на <b>чисте</b> = GMV − комісія.</p>
  <table class="caltbl" style="text-align:left;margin-top:1.2vh">
   <tr><th>Сценарій · показник</th><th>Без Bolt+ (10,35 млн)</th><th>З Bolt+ (11,5 млн)</th><th>Різниця</th></tr>
   <tr><td>Сц. 1 (10%) · комісія</td><td>1 035 000 ₴</td><td>1 184 500 ₴</td><td>+149 500 ₴</td></tr>
   <tr><td>Сц. 1 (10%) · чисте</td><td>9 315 000 ₴</td><td>10 315 500 ₴</td><td style="color:var(--green);font-weight:800">+1 000 500 ₴</td></tr>
   <tr><td>Сц. 2 (12%) · комісія</td><td>1 242 000 ₴</td><td>1 414 500 ₴</td><td>+172 500 ₴</td></tr>
   <tr><td>Сц. 2 (12%) · чисте</td><td>9 108 000 ₴</td><td>10 085 500 ₴</td><td style="color:var(--green);font-weight:800">+977 500 ₴</td></tr>
  </table>
  <div style="background:var(--green);color:#fff;border-radius:12px;padding:1.1vh 1.4vw;margin-top:1.3vh;font-size:1.02vw;text-align:center">
   Без Bolt+ економимо ~150–173 тис ₴ комісії, але чистими втрачаємо <b>~1 млн ₴</b> · кожна 1 ₴ комісії → <b>~7 ₴</b> обороту → <b>Bolt+ варте того</b>.
  </div>
</div>`,
// 5e consumer experience (MWB s13)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Досвід користувача</div><h2>Bolt інвестує в Consumer Experience</h2>
  <div class="cards">
   ${[['Персоналізований контент','Рекомендації на основі історії та вподобань користувача.'],['Зручний пошук і фільтри','Швидка навігація, що показує більше релевантних товарів.'],['Прості точки входу в магазини','High-intent вкладки внизу екрану ведуть у ваш магазин.'],['Bolt Plus для утримання','Переваги підписки підвищують частоту та повернення клієнтів.']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}
  </div>
</div>`,
// 5f marketing & ads (MWB s15)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Маркетингова підтримка</div><h2>Маркетинг і реклама, що ростять продажі магазину</h2>
  <div class="mkgrid">
   ${['Bolt Plus','In-app engagement','Merchant Offers','Online Ads','PR / Social Media','Email + Push'].map(m=>`<div class="mk"><div class="d"></div>${m}</div>`).join('')}
  </div>
  <p class="note">Комбінація каналів Bolt Food + Bolt Rides дає охоплення, недоступне поодинці.</p>
</div>`,
// 5g campaigns reach (MWB s16)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">Кампанії</div><h2>Маркетингові кампанії: до 10× охоплення</h2>
  <div class="scen">
   ${[['Standard','1× охоплення','Email + push Bolt Food',false],['Small','2× охоплення','+ In-app банер, email/push Food & Rides',false],['Big','10× охоплення','+ Спец-категорія, pop-up, соцмережі, paid ads, інфлюенсери',true]].map(s=>`<div class="scol${s[3]?' hot':''}"><div class="nm">${s[0]}</div><div class="gmv">${s[1]}</div><div class="sh">${s[2]}</div></div>`).join('')}
  </div>
</div>`,
// 5h in-store branding (MWB s17/36)
`${logo()}<div class="slide"><div class="bar"></div><div class="kick">In-store branding</div><h2>Підтримка офлайн-брендингу</h2>
  <div style="margin-top:2vh">
   ${[['Брендинг у точках —','Bolt підтримує оформлення та видимість бренду на місцях продажу.'],['Звʼязок онлайн ↔ офлайн —','офлайн-аудиторія дізнається про вашу присутність на Bolt Food.'],['Спільні матеріали —','банери, наліпки, POS-матеріали для промо-періодів.']].map(b=>`<div class="row" style="justify-content:flex-start;gap:.4vw"><b>${b[0]}</b> <span>${b[1]}</span></div>`).join('')}

let i=0;const stage=document.getElementById('stage'),dots=document.getElementById('dots');
stage.innerHTML=slides.map((h,n)=>`<div class="slidewrap${n===0?' on':''}" data-i="${n}" style="position:absolute;inset:0;display:${n===0?'block':'none'}">${h}</div>`).join('');
slides.forEach((_,n)=>{const d=document.createElement('div');d.className='dot'+(n===0?' on':'');d.onclick=()=>set(n);dots.appendChild(d)});
function set(n){i=Math.max(0,Math.min(slides.length-1,n));
  document.querySelectorAll('.slidewrap').forEach(w=>w.style.display=(+w.dataset.i===i)?'block':'none');
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('on',k===i));
  document.getElementById('counter').textContent=(i+1)+' / '+slides.length;}
function go(d){set(i+d)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
</script>
